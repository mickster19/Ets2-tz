<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MICKSTER VAULT | ETS2 Tanzania</title>
    <style>
        /* Premium Gaming Theme na Mickness */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 450px;
            text-align: center;
            background: #111;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #ff0000; /* Neon Red */
            font-size: 2rem;
            margin-bottom: 5px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }

        .sub-title {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        /* Muundo wa Picha */
        .game-image {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: 2px solid #ff0000;
            margin-bottom: 25px;
            transition: transform 0.3s;
        }

        .game-image:hover {
            transform: scale(1.02);
        }

        /* Button Styling */
        .btn {
            display: block;
            text-decoration: none;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        /* Download Button */
        .btn-download {
            background-color: #ff0000;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
        }

        .btn-download:hover {
            background-color: #cc0000;
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
            transform: translateY(-2px);
        }

        /* Setup Button */
        .btn-setup {
            background-color: transparent;
            color: #ff0000;
            border: 2px solid #ff0000;
        }

        .btn-setup:hover {
            background-color: rgba(255, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>MICKSTER VAULT</h1>
        <div class="sub-title">ETS2 TANZANIA FULL GAME v1.43</div>

        <img src="https://files.catbox.moe/ws9axl.jpg" alt="ETS2 Tanzania Preview" class="game-image">

        <a href="https://drive.usercontent.google.com/download?id=122PXsDCc2VNiYBStfocQFvFl9ikpLkJE&export=download&authuser=0" class="btn btn-download">
            Download Now
        </a>
        
        <a href="https://drive.google.com/file/d/1LbUQbEo9Eq2zjAGB8IDKNRAXTYvBEOvo/preview" class="btn btn-setup">
            Jinsi ya kuseti game
        </a>

        <footer>&copy; 2026 MICKSTER VAULT - Powered by Mickness Ahijo</footer>
    </div>

</body>
</html>
